name: Android test APK

on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Optional existing APK run for native acceptance; blank builds a fresh APK'
        required: false
        type: string
  push:
    branches: [main]
    paths: &mobile-paths
      - '.github/workflows/android-test-apk.yml'
      - 'src/**'
      - 'assets/**'
      - 'catalog/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - 'app.json'
      - 'package*.json'
      - 'metro.config.*'
      - 'tsconfig.json'
  pull_request:
    paths: *mobile-paths

permissions:
  contents: read
  actions: read

jobs:
  apk:
    if: ${{ !inputs.apk_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_BOOK_API_BASE_URL: ${{ vars.EXPO_PUBLIC_BOOK_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python scripts/test_catalog.py
      - run: npx expo install --check
      - run: npm run build:android-test
      - uses: actions/upload-artifact@v4
        with:
          name: bookmarkit-android-test
          path: |
            dist/bookmarkit-android-test.apk
            dist/bookmarkit-android-test.apk.sha256
          if-no-files-found: error
          retention-days: 30

  native-cover:
    needs: apk
    if: ${{ always() && (needs.apk.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.apk_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bookmarkit-android-test
          path: dist/apk
          run-id: ${{ inputs.apk_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: pip install Pillow
      - run: python scripts/create-ocr-images.py
      - name: Fetch public cover fixture
        run: |
          python -c "import urllib.request; from pathlib import Path; Path('dist/ocr-images/warbreaker-real.jpg').write_bytes(urllib.request.urlopen('https://covers.openlibrary.org/b/isbn/9780765320308-L.jpg?default=false', timeout=30).read())"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native OCR offline and online
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -cores 2 -memory 4096 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python scripts/android-cover-smoke.py --apk dist/apk/bookmarkit-android-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookmarkit-native-cover-evidence
          path: dist/android-phase8
          if-no-files-found: warn
          retention-days: 30
