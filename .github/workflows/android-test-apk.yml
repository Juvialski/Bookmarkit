name: Android test APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-test-apk.yml'
      - 'scripts/build-android-test.mjs'
      - 'app.json'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_BOOK_API_BASE_URL: ${{ vars.EXPO_PUBLIC_BOOK_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python scripts/test_catalog.py
      - run: npx expo install --check
      - run: npm run build:android-test
      - uses: actions/upload-artifact@v4
        with:
          name: bookmarkit-android-test
          path: |
            dist/bookmarkit-android-test.apk
            dist/bookmarkit-android-test.apk.sha256
          if-no-files-found: error
          retention-days: 30
