name: Android test APK

on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Optional existing APK run for native acceptance; blank builds a fresh APK'
        required: false
        type: string
  push:
    branches: [main]
    paths: &mobile-paths
      - '.github/workflows/android-test-apk.yml'
      - 'src/**'
      - 'assets/**'
      - 'catalog/**'
      - 'plugins/**'
      - 'scripts/build-android-test.mjs'
      - 'scripts/android-apk-smoke.py'
      - 'scripts/android-cover-smoke.py'
      - 'scripts/android-result-smoke.py'
      - 'scripts/create-ocr-images.py'
      - 'scripts/android-v2-*.py'
      - 'tests/**'
      - 'app.json'
      - 'package*.json'
      - 'metro.config.*'
      - 'babel.config.*'
      - 'app.config.*'
      - 'eas.json'
      - 'tsconfig.json'
  pull_request:
    paths: *mobile-paths

permissions:
  contents: read
  actions: read

jobs:
  mobile-scope:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
      apk_run_id: ${{ steps.scope.outputs.apk_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import fnmatch, json, os, subprocess
          patterns = ['src/*', 'assets/*', 'catalog/*', 'plugins/*', 'tests/*', 'app.json', 'package*.json', 'metro.config.*', 'babel.config.*', 'app.config.*', 'eas.json', 'tsconfig.json', 'scripts/build-android-test.mjs', 'scripts/android-*.py', 'scripts/create-ocr-images.py']
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              changed = True
          else:
              files = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], os.environ['HEAD_SHA']], text=True).splitlines()
              changed = any(fnmatch.fnmatch(path, pattern) for path in files for pattern in patterns)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(changed).lower() + '\n')
              # Reuse an already built APK only when ALL differences are native
              # acceptance scripts or the workflow, with identical build recipe.
              # Source/assets/packages/config changes always require a new build.
              reuse = ''
              def acceptance(path):
                  return path == '.github/workflows/android-test-apk.yml' or (path.startswith('scripts/android-') and path.endswith('.py'))
              def recipe(ref):
                  workflow = subprocess.check_output(['git', 'show', ref + ':.github/workflows/android-test-apk.yml'], text=True)
                  return workflow.split('  apk:\n', 1)[1].split('  native-cover:\n', 1)[0].split('    env:\n', 1)[1]
              if changed and os.environ['EVENT_NAME'] != 'workflow_dispatch':
                  runs = json.loads(subprocess.check_output(['gh', 'run', 'list', '--workflow', 'android-test-apk.yml', '--branch', os.environ['HEAD_BRANCH'], '--limit', '10', '--json', 'databaseId,headSha,status'], text=True))
                  for run in runs:
                      if run['status'] != 'completed': continue
                      if subprocess.run(['git', 'cat-file', '-e', run['headSha']], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode: continue
                      differences = subprocess.check_output(['git', 'diff', '--name-only', run['headSha'], os.environ['HEAD_SHA']], text=True).splitlines()
                      if not all(acceptance(path) for path in differences): continue
                      if recipe(run['headSha']) != recipe(os.environ['HEAD_SHA']): continue
                      artifacts = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + str(run['databaseId']) + '/artifacts'], text=True))['artifacts']
                      if any(a['name'] == 'bookmarkit-android-test' and not a['expired'] for a in artifacts):
                          reuse = str(run['databaseId']); break
              output.write('apk_run_id=' + reuse + '\n')
          PY
  apk:
    needs: mobile-scope
    if: ${{ needs.mobile-scope.outputs.changed == 'true' && !inputs.apk_run_id && needs.mobile-scope.outputs.apk_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_BOOK_API_BASE_URL: ${{ vars.EXPO_PUBLIC_BOOK_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python scripts/test_catalog.py
      - run: python scripts/validate_expanded.py catalog/packages
      - run: npx expo install --check
      - run: npm run build:android-test
      - uses: actions/upload-artifact@v4
        with:
          name: bookmarkit-android-test
          path: |
            dist/bookmarkit-android-test.apk
            dist/bookmarkit-android-test.apk.sha256
          if-no-files-found: error
          retention-days: 30

  native-cover:
    needs: [mobile-scope, apk]
    if: ${{ always() && (needs.apk.result == 'success' || needs.mobile-scope.outputs.apk_run_id != '' || (github.event_name == 'workflow_dispatch' && inputs.apk_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bookmarkit-android-test
          path: dist/apk
          run-id: ${{ inputs.apk_run_id || needs.mobile-scope.outputs.apk_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: pip install Pillow
      - run: python scripts/create-ocr-images.py
      - name: Fetch public cover fixture
        run: |
          python -c "import urllib.request; from pathlib import Path; Path('dist/ocr-images/warbreaker-real.jpg').write_bytes(urllib.request.urlopen('https://covers.openlibrary.org/b/isbn/9780765320308-L.jpg?default=false', timeout=30).read())"
      - name: Fetch previous test APK for update acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-test-2026-10-04 --repo Juvialski/Bookmarkit --pattern bookmarkit-android-test.apk --dir dist/baseline
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native OCR offline and online
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -cores 2 -memory 4096 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            python scripts/android-cover-smoke.py --apk dist/apk/bookmarkit-android-test.apk --baseline-apk dist/baseline/bookmarkit-android-test.apk
            python scripts/android-result-smoke.py --apk dist/apk/bookmarkit-android-test.apk
            python scripts/android-v2-layout.py --apk dist/apk/bookmarkit-android-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookmarkit-native-cover-evidence
          path: |
            dist/android-phase8
            dist/android-result
          if-no-files-found: warn
          retention-days: 30
