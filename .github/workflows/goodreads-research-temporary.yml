name: Temporary bounded Goodreads environment test
on:
  pull_request:
    paths: ['.github/workflows/goodreads-research-temporary.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist/research
          python - <<'PY'
          import json
          targets = [
            {'url':'https://www.goodreads.com/book/show/7235533', 'title':'The Way of Kings', 'authors':['Brandon Sanderson'], 'isbns':['9780765326355'], 'goodreads_work_id':'8134945'},
            {'url':'https://www.goodreads.com/book/show/3', 'title':"Harry Potter and the Sorcerer's Stone", 'authors':['J. K. Rowling'], 'isbns':['9780439554930'], 'goodreads_work_id':'4640799'},
            {'url':'https://www.goodreads.com/book/show/2657', 'title':'To Kill a Mockingbird', 'authors':['Harper Lee'], 'isbns':['9780061120084'], 'goodreads_work_id':'3275794'}]
          open('dist/research/target.json','w').write(json.dumps(targets))
          PY
          python scripts/research_goodreads.py --targets dist/research/target.json --output dist/research/runner.json --limit 3
          cat dist/research/runner.json
