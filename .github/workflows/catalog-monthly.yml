name: Monthly offline catalog
on:
  schedule:
    - cron: '17 4 5 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: dist/catalog/checkpoint.sqlite
          key: catalog-${{ github.run_id }}
      - run: python scripts/expanded_catalog.py --works 25000
      - run: python scripts/validate_expanded.py
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-offline-catalog
          path: |
            dist/catalog/expanded.db
            dist/catalog/manifest.json
          if-no-files-found: error
      - name: Publish validated catalog
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BOOKMARKIT_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'Configure BOOKMARKIT_SUPABASE_SERVICE_ROLE_KEY to enable publication.'
            exit 1
          fi
          python scripts/catalog_publish.py
